spring:
  application:
    name: library-lending
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DATABASE_USERNAME:library}
    password: ${DATABASE_PASSWORD:library}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping. Never update/create.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8081
